info:
  name: Get Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  GET /users requires a bearer token.

  The OAuth2 client-credentials auth is defined once in opencollection.yml.
  It reads clientSecret from the active environment.

  Use the `dotenv` environment to load the secret from `.env` at the
  collection root, or the `secret-var` environment to keep it in Bruno's
  encrypted secret store.
