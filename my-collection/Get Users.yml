info:
  name: Get Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  GET /users requires a bearer token.

  The OAuth2 client-credentials auth is defined once in opencollection.yml.
  `auth: inherit` tells this request to use it. Bruno fetches the token
  automatically when it is missing or expired, then reuses the cached token
  until the issuer's expiry (6 hours in this demo).
